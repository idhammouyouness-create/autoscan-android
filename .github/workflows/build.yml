name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Test summary
        if: always()
        run: |
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            grep -o '<testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f"
          done

      - name: Verify generated PDF with independent tools
        run: |
          sudo apt-get install -y -qq qpdf poppler-utils > /dev/null
          pip install -q pypdf
          qpdf --check app/build/test-pdf/sample.pdf
          python3 -c "
          import pypdf
          r = pypdf.PdfReader('app/build/test-pdf/sample.pdf', strict=True)
          print('pypdf pages:', len(r.pages))
          for i, p in enumerate(r.pages):
              print(' page', i + 1, 'size pt:', [round(float(v), 1) for v in p.mediabox[2:]])
          assert len(r.pages) == 3
          "
          pdftoppm -r 20 -png app/build/test-pdf/sample.pdf /tmp/render
          ls -la /tmp/render*

      - name: Build APK (release, test-signed)
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Publish APK as a GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          cp "$APK" AutoScan-v1.0.${{ github.run_number }}.apk
          gh release create "v1.0.${{ github.run_number }}" AutoScan-v1.0.${{ github.run_number }}.apk \
            --title "AutoScan 1.0.${{ github.run_number }}" \
            --notes "Build ${{ github.sha }}. Test-signed APK: install on the phone directly."

      - name: Add Gradle wrapper to the repository (for Android Studio)
        if: github.ref == 'refs/heads/main'
        run: |
          if [ ! -f gradlew ]; then
            gradle --no-daemon wrapper --gradle-version 8.11.1
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper
            git commit -m "Add Gradle wrapper [skip ci]"
            git push
          fi

  device-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Detector accuracy tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest || touch failed.flag; adb logcat -d -s AccuracyTest:I > accuracy.txt; cat accuracy.txt; adb logcat -d -s ImgDump:I | grep -o "ImgDump: .*"; test ! -f failed.flag
